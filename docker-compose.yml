services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emba_sim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emba_sim_password}
      POSTGRES_DB: ${POSTGRES_DB:-emba_sim}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emba_sim} -d ${POSTGRES_DB:-emba_sim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-emba_sim}:${POSTGRES_PASSWORD:-emba_sim_password}@db:5432/${POSTGRES_DB:-emba_sim}}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-emba_sim}
      PGPASSWORD: ${POSTGRES_PASSWORD:-emba_sim_password}
      PGDATABASE: ${POSTGRES_DB:-emba_sim}
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      ADMIN_CODE: ${ADMIN_CODE:-change-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      HF_DISABLE_REMOTE: ${HF_DISABLE_REMOTE:-0}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
